services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: portal_automacoes
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - packages_data:/data/packages
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info -Q critical,high,normal,low
    volumes:
      - ./backend:/app
      - packages_data:/data/packages
    depends_on:
      - backend
      - redis
      - minio

  beat:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    # Ticks every minute (see app/core/celery_app.py beat_schedule) and
    # enqueues app.tasks.schedule_tasks.sync, which is what actually
    # dispatches Jobs for due Schedules -- without this service, Schedules
    # are just cadastro and nothing ever fires automatically.
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis

  flower:
    image: mher/flower:2.0
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: 5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

  frontend:
    image: node:20-alpine
    working_dir: /app
    # output: "standalone" nao copia _next/static nem public/ para dentro da
    # pasta standalone sozinho (e um passo manual, documentado pelo proprio
    # Next.js) — sem isso, TODO chunk JS/CSS responde 404 e a pagina quebra
    # com ChunkLoadError, mesmo com o build "funcionando".
    command: sh -c "npm install --include=dev && npm run build && cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static && node .next/standalone/server.js"
    environment:
      # Sem NEXT_PUBLIC_API_URL fixo: o frontend descobre o host da API em tempo
      # de execucao (mesmo hostname/IP usado para abrir o site, porta 8000) —
      # ver src/lib/constants.ts. Isso permite acessar via localhost OU pelo IP
      # da maquina na rede sem precisar rebuildar com uma URL diferente.
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:
  packages_data:
