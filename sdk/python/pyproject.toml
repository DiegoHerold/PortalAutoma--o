[project]
name = "portal-automacoes-sdk"
version = "0.2.0"
description = "SDK para automações emitirem eventos ao Portal de Automações, pelo Agent local ou direto ao Portal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
imagens = ["pillow>=10"]
direto = ["cryptography>=42"]
dev = ["pytest>=8", "cryptography>=42", "pillow>=10"]

[project.scripts]
portal-automacoes = "portal_automacoes.trabalhador:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["portal_automacoes*"]

[tool.setuptools.package-data]
portal_automacoes = ["contrato/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
